<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favor AI - Email Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; background-color: #212121; color: #ececf1; }
        
        /* Sidebar Styles */
        .sidebar { width: 260px; background-color: #171717; display: flex; flex-direction: column; padding: 10px; justify-content: space-between; }
        .new-chat-btn { border: 1px solid #4d4d4d; padding: 12px; border-radius: 5px; text-align: left; background: transparent; color: white; cursor: pointer; transition: 0.2s; }
        .new-chat-btn:hover { background-color: #2a2b32; }
        .history-list { flex-grow: 1; margin-top: 20px; overflow-y: auto; }
        .history-item { padding: 10px; border-radius: 5px; cursor: pointer; margin-bottom: 5px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover { background-color: #2a2b32; }
        
        /* Google Sign-In Area */
        .auth-section { padding: 10px; border-top: 1px solid #4d4d4d; text-align: center; }
        .google-btn { background-color: white; color: #333; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; width: 100%; justify-content: center; }
        .user-profile { display: none; align-items: center; gap: 10px; color: white; font-size: 14px; }
        .user-profile img { width: 32px; height: 32px; border-radius: 50%; }

        /* Main Chat Window */
        .main-chat { flex-grow: 1; display: flex; flex-direction: column; background-color: #212121; }
        .chat-header { padding: 15px; border-bottom: 1px solid #4d4d4d; text-align: center; font-size: 18px; font-weight: 600; color: #c5c5d2; }
        .chat-messages { flex-grow: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; }
        
        /* ChatGPT Row Styling */
        .message-row { padding: 24px 48px; display: flex; gap: 20px; font-size: 16px; line-height: 1.5; }
        .user-row { background-color: #212121; }
        .assistant-row { background-color: #2f2f2f; border-top: 1px solid #4d4d4d; border-bottom: 1px solid #4d4d4d; }
        .avatar { width: 30px; height: 30px; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .user-avatar { background-color: #5436da; color: white; }
        .favor-avatar { background-color: #ff6b00; color: white; }
        
        /* Input Area */
        .input-container { padding: 20px 48px; background-image: linear-gradient(180deg,rgba(33,33,33,0),#212121 50%); }
        .input-box-wrapper { max-width: 768px; margin: 0 auto; position: relative; display: flex; background-color: #2f2f2f; border: 1px solid #4d4d4d; border-radius: 12px; padding: 12px; }
        .input-box-wrapper textarea { flex-grow: 1; background: transparent; border: none; color: white; resize: none; outline: none; height: 24px; font-size: 16px; }
        .send-btn { background: transparent; border: none; color: #ff6b00; cursor: pointer; font-size: 18px; padding-left: 10px; }
    </style>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div class="sidebar">
        <button class="new-chat-btn" onclick="clearChat()">+ New chat</button>
        
        <div class="history-list" id="historyList">
            <div class="history-item">Drafting support reply...</div>
            <div class="history-item">Scan unread emails</div>
        </div>
        
        <div class="auth-section">
            <div id="g_id_onload"
                 data-client_id="611910597994-u5eac6f6inrbtu8d1l1ap7gpccshfrk9.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-text="sign_in_with" data-shape="rectangular" id="loginBtn"></div>
            
            <div class="user-profile" id="userProfile">
                <img src="" id="userAvatar" alt="User Avatar">
                <span id="userName">Logged in</span>
            </div>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">Favor AI (Qwen Backend)</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message-row assistant-row">
                <div class="avatar favor-avatar">F</div>
                <div class="text">Hello! I am Favor. Sign in with Google to give me access to help you with your Gmail!</div>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-box-wrapper">
                <textarea id="userInput" placeholder="Ask Favor to read or send an email..."></textarea>
                <button class="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <script>
        let currentUserEmail = null;
        const n8nWebhookUrl = 'http://localhost:5678/webhook/d5c2192a-4bd8-4f8d-9f6d-bb87298e1060/chat'; // Update this to Render link later

        // Handle the Google Sign-in response
        function handleCredentialResponse(response) {
            // Decode the Google JWT Token to get user details
            const responsePayload = JSON.parse(atob(response.credential.split('.')[1]));
            currentUserEmail = responsePayload.email;
            
            // Switch login button out for user profile UI
            document.getElementById('loginBtn').style.display = 'none';
            const profile = document.getElementById('userProfile');
            profile.style.display = 'flex';
            document.getElementById('userAvatar').src = responsePayload.picture;
            document.getElementById('userName').innerText = responsePayload.given_name;
        }

        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if(!text) return;
            
            inputEl.value = '';
            appendMessage(text, 'user');

            // Send message along with user session context to n8n
            try {
                const response = await fetch(n8nWebhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chatInput: text,
                        userEmail: currentUserEmail || "anonymous" // Passes the logged-in email to n8n
                    })
                });
                const data = await response.json();
                // Pull out response back from n8n backend output array
                appendMessage(data.output || data[0]?.output || "I ran into a loop, check n8n canvas!", 'assistant');
            } catch (err) {
                appendMessage("Error communicating with Favor backend.", 'assistant');
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chatMessages');
            const isUser = sender === 'user';
            const row = document.createElement('div');
            row.className = `message-row ${isUser ? 'user-row' : 'assistant-row'}`;
            row.innerHTML = `
                <div class="avatar ${isUser ? 'user-avatar' : 'favor-avatar'}">${isUser ? 'U' : 'F'}</div>
                <div class="text">${text}</div>
            `;
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function clearChat() {
            document.getElementById('chatMessages').innerHTML = '';
        }
    </script>
</body>
</html>
